name: GravityEdit Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: JDK 17 • Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 4 Engine Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload GravityEdit Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE="GravityEdit-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          gh release create "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" \
            --title "GravityEdit ${TAG_NAME} — Googlebook OS & Android (Play Protect Verified)" \
            --notes "### GravityEdit ${TAG_NAME} Release
          - **New Document & File Type Selector (\`+\` / \`Ctrl+N\`):** Choose file type & extension (\`.txt\`, \`.ps1\`, \`.psm1\`, \`.psd1\`, \`.md\`, \`.json\`, \`.yaml\`, \`.xml\`, \`.kt\`, \`.py\`, \`.sh\`, \`.html\`, \`.css\`), encoding, line endings, and starter template from any \`+\` button
          - **Inline Click-to-Select & Rename Document Titles:** Click any active tab or sidebar document title to highlight and rename it inline with automatic syntax language switching
          - **Google Play Protect–Compatible Auto-Update Engine:** Install-source channel detection (\`com.android.vending\` vs. GitHub HTTPS), TLS 1.3 download, APK ZIP magic header & SHA-256 verification, and user-consented System \`PackageInstaller\` handoff via scoped \`FileProvider\`
          - **First-Class PowerShell Engine & 1:1 BBEdit Feature Parity:** Real-time syntax highlighting, AST Function Navigator, Code Folding, Inline Auto-Completion, \`PSScriptAnalyzer\` Live Linter, PCRE Find/Replace + Pattern Playground, 14-Operation Text Factory, Clippings Library, Myers Side-by-Side Diff, Command Palette (\`Ctrl+Shift+P\`), and 6-Language Runtime Localization (\`EN\`, \`DE\`, \`IT\`, \`ES\`, \`FR\`, \`EL\`)

          ### Cryptographic Integrity (Play Protect Auto-Update Verification)
          - **APK Asset:** \`${APK_FILE}\`
          - **SHA-256:** \`${APK_SHA256}\`"

