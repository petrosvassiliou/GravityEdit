name: GravityEdit Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: JDK 17 • Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 4 Engine Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload GravityEdit Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE="GravityEdit-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          cat <<EOF > release-notes.md
          ### GravityEdit ${TAG_NAME} — Quality Assurance & Reliability Update
          - **Editor Cursor, Selection & Hardware Keys:** Fixed real-time \`Ln/Col\` & Selection Statistics sync, \`Enter\` key smart \`{\`/\`(\` auto-indent when \`softWrap\` is off, \`Tab\`/\`Shift+Tab\` completion & block indentation, and \`Up\`/\`Down\` arrow cross-line navigation
          - **Split-View, Mobile Ergonomics & Edge-to-Edge Insets:** Isolated per-pane folds/diagnostics/matches in Split View, added Android edge-to-edge \`systemBarsPadding()\`, made the bottom Status Bar horizontally scrollable on compact phones, selected filename stems on inline tab rename, and added \`Ctrl++\` / \`Ctrl+-\` / \`Ctrl+0\` zoom shortcuts
          - **PowerShell Diagnostics & Clippings Engine:** Tracked \`@{\`, \`@(\`, and \`\$(\` delimiters without false-positive brace/paren errors, detected aliases after pipes/assignments and inside \`"\$(...)"\` interpolations while ignoring hashtable keys, fixed \`\$sender\`, and fixed \`\$(\$MyInvocation.MyCommand.Name)\` in \`ps_cmdlet_binding\`
          - **Complete Find/Replace & BBEdit Text Factory Controls:** Added \`Multi-Line (^\$)\` and \`Dot Matches All (?s)\` chips, fixed \`Selection Only\` range exclusivity & Multi-File jump-to-line on unopened SAF files, exposed all 8 remaining Text Factory step controls, and added automatic release metadata pre-fetch to the Play Protect Auto-Update Center

          ### Cryptographic Integrity (Play Protect Auto-Update Verification)
          - **APK Asset:** \`${APK_FILE}\`
          - **SHA-256:** \`${APK_SHA256}\`
          EOF
          gh release create "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" \
            --title "GravityEdit ${TAG_NAME} — Quality & Reliability Update (Play Protect Verified)" \
            --notes-file release-notes.md

