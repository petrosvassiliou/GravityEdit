name: GravityEdit Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: JDK 17 • Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 4 Engine Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload GravityEdit Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE="GravityEdit-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          cat <<EOF > release-notes.md
          ### GravityEdit ${TAG_NAME} — Material 3 Expressive Design & Comprehensive QS Update
          - **Material 3 Expressive Design System:** High-chroma Light/Dark/AMOLED/Dynamic color containers (\`surfaceContainerLowest\`..\`Highest\`), \`GravityExpressiveShapes\` (\`10dp\`–\`32dp\` + full-pill \`CircleShape\`), spring-physics \`GravityExpressiveMotion\` (\`spatialFast\` / \`spatialDefault\` / \`effectsDefault\`), morphing pill tabs & auxiliary symbol keys, connected \`Single | Vertical | Horizontal\` Split-Mode button group, and \`28dp\` Expressive dialogs & adaptive mobile \`ModalBottomSheet\`s
          - **Pinned Bottom-Left App Version Badge:** Always-visible \`v1.2.0\` version pill anchored at the true bottom-left corner of the screen across both Googlebook OS Desktop and Android Compact Mobile layouts (retaining \`v1.2.0 • ⬆ vX.Y.Z\` when updates are available and opening the Play Protect Update Center on tap)
          - **100% UI Action & Menu Parity (Round 2 QS):** Added \`WorkspaceOverflowDropdownMenu\` on Desktop & Mobile exposing every File, Edit, Navigation, Tool, Settings, and Update action; unified Expressive tab bar with localized context menus on both Desktop & Mobile; fixed background-tab \`Save\` focus preservation (\`requestSaveDocument\`) and search-match cleanup; completed Command Palette entries; and verified 132/132 string key parity across all 6 languages (\`en\`, \`de\`, \`es\`, \`fr\`, \`it\`, \`el\`)

          ### Cryptographic Integrity (Play Protect Auto-Update Verification)
          - **APK Asset:** \`${APK_FILE}\`
          - **SHA-256:** \`${APK_SHA256}\`
          EOF
          gh release create "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" \
            --title "GravityEdit ${TAG_NAME} — Material 3 Expressive Design & QS Update" \
            --notes-file release-notes.md

