name: GravityEdit Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: JDK 17 • Unit Tests & Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 4 Engine & Play Protect Hygiene Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Materialize Encrypted Release Keystore & Assemble Signed Release APK
        env:
          GRAVITY_KEYSTORE_BASE64: ${{ secrets.GRAVITY_KEYSTORE_BASE64 }}
          GRAVITY_KEYSTORE_PASSWORD: ${{ secrets.GRAVITY_KEYSTORE_PASSWORD }}
          GRAVITY_KEY_ALIAS: ${{ secrets.GRAVITY_KEY_ALIAS }}
          GRAVITY_KEY_PASSWORD: ${{ secrets.GRAVITY_KEY_PASSWORD }}
        run: |
          if [ -n "$GRAVITY_KEYSTORE_BASE64" ]; then
            echo "$GRAVITY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gravityedit-release.jks"
            export GRAVITY_KEYSTORE_PATH="$RUNNER_TEMP/gravityedit-release.jks"
          fi
          gradle assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/gravityedit-release.jks"

      - name: Verify APK Signature Schemes (v1 / v2 / v3) & Clean Permissions
        if: env.HAS_SIGNING == 'true'
        env:
          HAS_SIGNING: ${{ secrets.GRAVITY_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        run: |
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          echo "=== Declared APK Permissions ==="
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk
          if "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | grep -q "REQUEST_INSTALL_PACKAGES"; then
            echo "ERROR: High-risk REQUEST_INSTALL_PACKAGES permission found in release APK!"
            exit 1
          fi

      - name: Upload GravityEdit Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE="GravityEdit-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          cat <<EOF > release-notes.md
          ### GravityEdit ${TAG_NAME} — Google Play Protect Clean Security Update & Material 3 Expressive
          - **Google Play Protect Zero-Risk Hardening:** Removed \`android.permission.REQUEST_INSTALL_PACKAGES\`, the \`apk_updates\` \`FileProvider\`, and all in-app \`.apk\` download / \`PackageInstaller\` bytecode that triggered Google Play Protect's sideloaded dropper / sensitive-permission risk heuristic. GravityEdit now requests **zero sensitive or special permissions** (only standard \`INTERNET\` for optional read-only JSON version checks) and delegates updates strictly to Google Play or the trusted system browser.
          - **Encrypted CI Release Signing (\`v1 + v2 + v3\`):** Moved the production release signing key into encrypted GitHub Actions Secrets (\`CN=GravityEdit Release\`, \`com.gravityedit.app\`), verified automatically on every build with Android SDK \`apksigner\` and \`aapt2 dump permissions\`.
          - **Material 3 Expressive Design & 100% QS Parity:** High-chroma Light/Dark/AMOLED/Dynamic themes, morphing pill tabs & symbol bar, connected Split-Mode button group, pinned bottom-left \`${TAG_NAME}\` badge, \`WorkspaceOverflowDropdownMenu\` (\`⋮\`), and 132/132 localized string parity across 6 languages.

          ### Cryptographic Integrity
          - **Package ID:** \`com.gravityedit.app\`
          - **Permissions:** \`android.permission.INTERNET\` only (0 sensitive/install permissions)
          - **APK Signature Schemes:** \`v1 + v2 + v3\`
          - **Certificate SHA-256:** \`0D:4D:1A:CA:6F:EC:72:2D:78:29:9D:80:E8:DD:B2:6E:45:18:5E:D4:D8:BE:C4:36:5A:19:8C:0D:BA:37:1B:C2\`
          - **APK Asset:** \`${APK_FILE}\`
          - **SHA-256:** \`${APK_SHA256}\`
          EOF
          gh release create "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" \
            --title "GravityEdit ${TAG_NAME} — Play Protect Clean Release & Material 3 Expressive" \
            --notes-file release-notes.md
