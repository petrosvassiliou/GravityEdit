name: GravityEdit Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: JDK 17 • Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 4 Engine Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Signed Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK Signature Schemes (v1 / v2 / v3) & Certificate
        run: |
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload GravityEdit Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE="GravityEdit-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          cat <<EOF > release-notes.md
          ### GravityEdit ${TAG_NAME} — Signed Production Release APK & Material 3 Expressive Update
          - **Production Release APK Signing Fix (\`v1 + v2 + v3\`):** Switched published release binaries from ephemeral CI \`debug\` builds (\`com.gravityedit.app.debug\`, \`android:debuggable="true"\`, per-run random \`CN=Android Debug\` key) to a **persistently signed R8-shrunk production \`release\` APK** (\`com.gravityedit.app\`, \`CN=GravityEdit Release\`) with **APK Signature Schemes v1, v2, and v3** enabled. Resolves Android \`PackageInstaller\` signature-conflict rejections (\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\`) and Play Protect debug-certificate warnings across all Android 8–16 & Googlebook OS devices.
          - **Material 3 Expressive Design System:** High-chroma Light/Dark/AMOLED/Dynamic color containers (\`surfaceContainerLowest\`..\`Highest\`), \`GravityExpressiveShapes\` (\`10dp\`–\`32dp\` + full-pill \`CircleShape\`), spring-physics \`GravityExpressiveMotion\`, morphing pill tabs & auxiliary symbol keys, connected \`Single | Vertical | Horizontal\` Split-Mode button group, and \`28dp\` Expressive dialogs & adaptive mobile \`ModalBottomSheet\`s.
          - **Pinned Bottom-Left App Version Badge:** Always-visible \`${TAG_NAME}\` version pill anchored at the true bottom-left corner of the screen across both Googlebook OS Desktop and Android Compact Mobile layouts (tappable to open the Play Protect Update Center).
          - **100% UI Action & Menu Parity:** \`WorkspaceOverflowDropdownMenu\` (\`⋮\`) on Desktop & Mobile, unified tab context menus, complete Command Palette triggers, and 132/132 localized string parity across \`en\`, \`de\`, \`es\`, \`fr\`, \`it\`, and \`el\`.

          > **Upgrading from \`v1.0.0\`–\`v1.1.1\`:** Earlier builds used the \`.debug\` package suffix (\`com.gravityedit.app.debug\`). \`GravityEdit-${TAG_NAME}.apk\` installs cleanly under the production package ID (\`com.gravityedit.app\`); you can safely uninstall the old debug copy if present. All future updates will upgrade seamlessly in-place.

          ### Cryptographic Integrity (Play Protect Auto-Update Verification)
          - **Package ID:** \`com.gravityedit.app\`
          - **APK Signature Schemes:** \`v1 (JAR) + v2 (APK Sig Block) + v3 (Key Rotation Ready)\`
          - **Certificate SHA-256:** \`0D:4D:1A:CA:6F:EC:72:2D:78:29:9D:80:E8:DD:B2:6E:45:18:5E:D4:D8:BE:C4:36:5A:19:8C:0D:BA:37:1B:C2\`
          - **APK Asset:** \`${APK_FILE}\`
          - **SHA-256:** \`${APK_SHA256}\`
          EOF
          gh release create "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" \
            --title "GravityEdit ${TAG_NAME} — Signed Production Release & Material 3 Expressive" \
            --notes-file release-notes.md

