name: GravityEdit Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: JDK 17 • Unit Tests & Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JUnit 4 Engine & Play Protect Hygiene Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Materialize Encrypted Release Keystore & Assemble Signed Release APK
        env:
          GRAVITY_KEYSTORE_BASE64: ${{ secrets.GRAVITY_KEYSTORE_BASE64 }}
          GRAVITY_KEYSTORE_PASSWORD: ${{ secrets.GRAVITY_KEYSTORE_PASSWORD }}
          GRAVITY_KEY_ALIAS: ${{ secrets.GRAVITY_KEY_ALIAS }}
          GRAVITY_KEY_PASSWORD: ${{ secrets.GRAVITY_KEY_PASSWORD }}
        run: |
          if [ -n "$GRAVITY_KEYSTORE_BASE64" ]; then
            echo "$GRAVITY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gravityedit-release.jks"
            export GRAVITY_KEYSTORE_PATH="$RUNNER_TEMP/gravityedit-release.jks"
          fi
          gradle assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/gravityedit-release.jks"

      - name: Verify APK Signature Schemes (v1 / v2 / v3) & Clean Permissions
        if: env.HAS_SIGNING == 'true'
        env:
          HAS_SIGNING: ${{ secrets.GRAVITY_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        run: |
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          echo "=== Declared APK Permissions ==="
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk
          if "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | grep -q "REQUEST_INSTALL_PACKAGES"; then
            echo "ERROR: High-risk REQUEST_INSTALL_PACKAGES permission found in release APK!"
            exit 1
          fi

      - name: Upload GravityEdit Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE="GravityEdit-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          cat <<EOF > release-notes.md
          ### GravityEdit ${TAG_NAME} — macOS Liquid Glass Edition + Android / Googlebook OS Workbench
          - **New Native macOS Edition (\`GravityEdit-macOS-${TAG_NAME}.dmg\` & \`.app.zip\`):** Built in SwiftUI + AppKit (\`NSTextView\`) with **Apple Liquid Glass** design (\`GlassEffectContainer\`, \`.glassEffect\`, \`.glassEffectID\`, floating \`NavigationSplitView\` sidebar, unified window toolbar, crisp high-contrast code canvas, and macOS Sequoia vibrancy fallback) and strict Apple HIG compliance.
          - **In-App Automatic Updates on macOS (Sparkle 2 + CryptoKit SHA-256):** Integrated \`SPUStandardUpdaterController\` (\`appcast.xml\`) plus verified in-app \`.app.zip\` SHA-256 bundle updates & automatic relaunch.
          - **1:1 Cross-Platform PowerShell & BBEdit Parity:** Shared feature set across macOS, Googlebook OS, and Android — PowerShell AST & Procedural Script Navigator (\`Funktionsnavigator\`), Code Folding, Inline Completions, live \`PSScriptAnalyzer\` Quick Fixes, all 14 BBEdit Text Factory operations, PCRE Find/Replace + Multi-File Search, Side-by-Side Myers Diff, Clippings, and 6-language localization (\`en\`, \`de\`, \`it\`, \`es\`, \`fr\`, \`el\`).
          - **Google Play Protect Zero-Risk Hardening (\`0\` Sensitive Permissions):** Android APK (\`com.gravityedit.app\`, \`v1 + v2 + v3\` signed) requests only standard \`INTERNET\` with zero install/sensitive permissions.

          ### Android APK Integrity
          - **Package ID:** \`com.gravityedit.app\`
          - **APK Asset:** \`${APK_FILE}\` (\`${APK_SHA256}\`)
          EOF
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" --clobber
          else
            gh release create "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" \
              --title "GravityEdit ${TAG_NAME} — macOS Liquid Glass & Android / Googlebook OS Release" \
              --notes-file release-notes.md || \
            gh release upload "$TAG_NAME" "$APK_FILE" "${APK_FILE}.sha256" --clobber
          fi

