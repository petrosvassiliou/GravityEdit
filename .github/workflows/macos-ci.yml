name: GravityEdit macOS CI & Release (Liquid Glass)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package-macos:
    name: Xcode 26 (macOS 26 Tahoe) • XCTest, Universal arm64+x86_64 .app, .dmg & Sparkle Appcast
    runs-on: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode 26 & Swift Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run GravityEditCore XCTest Suite
        working-directory: macos
        run: |
          swift build --build-tests
          BIN_DIR="$(swift build --build-tests --show-bin-path)"
          xcrun xctest "${BIN_DIR}/GravityEditMacPackageTests.xctest"

      - name: Import Optional Apple Developer ID Certificate into Ephemeral Keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -n "${MACOS_CERT_P12_BASE64}" ] && [ -n "${MACOS_CERT_PASSWORD}" ]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/gravityedit-signing.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            echo "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/dev_id.p12"
            security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security import "${RUNNER_TEMP}/dev_id.p12" -P "${MACOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
            security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            rm -f "${RUNNER_TEMP}/dev_id.p12"
            echo "GRAVITY_EPHEMERAL_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          fi

      - name: Build Universal GravityEdit.app, DMG, ZIP, Homebrew Cask & Sparkle Appcast
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REL_VER="${GITHUB_REF#refs/tags/v}"
          else
            REL_VER="1.5.0"
          fi
          ./macos/scripts/package_app.sh "${REL_VER}"

      - name: Verify macOS Bundle Integrity, Universal arm64 Slice, Sparkle Linkage, Code Signature, Editor Pixel Rendering & Live Launch
        run: |
          APP="macos/dist/GravityEdit.app"
          test -f "${APP}/Contents/MacOS/GravityEdit"
          test -f "${APP}/Contents/MacOS/gravity"
          "${APP}/Contents/MacOS/gravity" --version
          test -f "${APP}/Contents/Resources/AppIcon.icns"
          test -d "${APP}/Contents/Frameworks/Sparkle.framework"
          ARCHS="$(lipo -archs "${APP}/Contents/MacOS/GravityEdit")"
          echo "Built Mach-O architectures: ${ARCHS}"
          echo "${ARCHS}" | grep -q "arm64"
          otool -L "${APP}/Contents/MacOS/GravityEdit"
          codesign -dvvv "${APP}/Contents/MacOS/GravityEdit" 2>&1
          codesign -dvvv "${APP}/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1
          codesign --verify --deep --strict --verbose=2 "${APP}"
          plutil -lint "${APP}/Contents/Info.plist"

          echo "==> Verifying AppKit TextKit 1 code canvas glyph pixel rendering..."
          swift macos/scripts/verify_editor_rendering.swift

          echo "==> Executing live macOS process launch & dyld @rpath/Sparkle.framework smoke test..."
          SMOKE_DIR="$(mktemp -d)"
          ditto -x -k macos/dist/GravityEdit-macOS-*.app.zip "${SMOKE_DIR}"
          SMOKE_BIN="${SMOKE_DIR}/GravityEdit.app/Contents/MacOS/GravityEdit"

          "${SMOKE_BIN}" >/tmp/gravityedit-smoke.log 2>&1 &
          SMOKE_PID=$!
          sleep 4

          if ! kill -0 "${SMOKE_PID}" 2>/dev/null; then
            echo "ERROR: GravityEdit exited or crashed during dyld/SwiftUI startup!"
            cat /tmp/gravityedit-smoke.log || true
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
            cat ~/Library/Logs/DiagnosticReports/GravityEdit* 2>/dev/null || true
            exit 1
          fi

          echo "SUCCESS: GravityEdit (PID ${SMOKE_PID}) launched cleanly, mapped Sparkle.framework via dyld4, and stayed running!"
          kill -TERM "${SMOKE_PID}" 2>/dev/null || true
          wait "${SMOKE_PID}" 2>/dev/null || true
          rm -rf "${SMOKE_DIR}"

      - name: Upload macOS Release Bundle Artifacts (.dmg, .app.zip, appcast.xml, gravityedit.rb)
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-macOS-LiquidGlass
          path: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
            macos/dist/*.app.zip
            macos/dist/*.app.zip.sha256
            macos/dist/appcast.xml
            macos/dist/gravityedit.rb

      - name: Publish macOS Assets, Homebrew Cask & Sparkle Appcast to GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          DMG_FILE="macos/dist/GravityEdit-macOS-${TAG_NAME}.dmg"
          ZIP_FILE="macos/dist/GravityEdit-macOS-${TAG_NAME}.app.zip"
          APPCAST_FILE="macos/dist/appcast.xml"
          CASK_FILE="macos/dist/gravityedit.rb"
          DMG_SHA=$(awk '{print $1}' "${DMG_FILE}.sha256")
          ZIP_SHA=$(awk '{print $1}' "${ZIP_FILE}.sha256")

          cat <<EOF > macos-release-notes.md
          ### GravityEdit ${TAG_NAME} — macOS Liquid Glass Edition + Android / Googlebook OS Workbench
          - **Git Workbench & Live Gutter Diff Bars:** Real-time green/orange/red line-change bars in the editor gutter plus a 1-click Git branch status pill supporting Compare with \`HEAD\`, \`git add\` file staging, and baseline revert.
          - **PowerShell \`Show-Command\` Builder (\`⇧⌘I\`), \`F1\` Quick Help & Pester Test Runner (\`⌃⇧T\`):** Auto-generates interactive forms from \`param(...)\` (\`[Mandatory]\`, \`[ValidateSet]\`, \`[switch]\`), displays instant offline/live \`Get-Help\` & \`<# .SYNOPSIS #>\` reference, and runs \`Describe\` / \`Context\` / \`It\` Pester test suites with line jumps.
          - **Structured CSV / JSON Data Grid (\`⌃⇧G\`) & Live Markdown / HTML Split Preview (\`⌃⌘P\`):** Two-way RFC-4180 CSV/TSV & JSON object-array table inspector plus CSP-hardened offline GFM Markdown & HTML5 split preview.
          - **BBEdit-Style Remote SFTP / SSH Open & Save (\`⌥⌘K\`):** Browse remote SSH servers, open remote tabs, and save directly back over SFTP via \`⌘S\` / \`Ctrl+S\`.
          - **Homebrew Cask Support:** Install \`GravityEdit.app\` and the \`gravity\` CLI via \`brew tap petrosvassiliou/gravityedit https://github.com/petrosvassiliou/GravityEdit && brew install --cask gravityedit\`.

          ### macOS Cryptographic Digests
          - **DMG Installer:** \`GravityEdit-macOS-${TAG_NAME}.dmg\` (\`${DMG_SHA}\`)
          - **In-App Update Archive:** \`GravityEdit-macOS-${TAG_NAME}.app.zip\` (\`${ZIP_SHA}\`)
          - **Sparkle Feed & Homebrew Cask:** \`appcast.xml\` • \`gravityedit.rb\`
          EOF

          ASSETS=(
            "${DMG_FILE}"
            "${DMG_FILE}.sha256"
            "${ZIP_FILE}"
            "${ZIP_FILE}.sha256"
            "${APPCAST_FILE}"
            "${CASK_FILE}"
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "GravityEdit ${TAG_NAME} — macOS Liquid Glass & Android / Googlebook OS Release" \
              --notes-file macos-release-notes.md || \
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          fi

      - name: Sync SHA-256 Homebrew Cask to Optional petrosvassiliou/homebrew-tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping external tap push (in-repo Casks/gravityedit.rb remains active)."
            exit 0
          fi
          TAP_DIR="$(mktemp -d)"
          if git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/petrosvassiliou/homebrew-tap.git" "${TAP_DIR}"; then
            mkdir -p "${TAP_DIR}/Casks"
            cp macos/dist/gravityedit.rb "${TAP_DIR}/Casks/gravityedit.rb"
            cd "${TAP_DIR}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/gravityedit.rb
            if ! git diff --cached --quiet; then
              git commit -m "gravityedit ${GITHUB_REF#refs/tags/}"
              git push origin HEAD
            fi
          fi
          rm -rf "${TAP_DIR}"

      - name: Clean Up Ephemeral Signing Keychain
        if: always()
        run: |
          if [ -n "${GRAVITY_EPHEMERAL_KEYCHAIN:-}" ] && [ -f "${GRAVITY_EPHEMERAL_KEYCHAIN}" ]; then
            security delete-keychain "${GRAVITY_EPHEMERAL_KEYCHAIN}" || true
          fi
