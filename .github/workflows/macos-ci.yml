name: GravityEdit macOS CI & Release (Liquid Glass)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package-macos:
    name: Xcode 26 (macOS 26 Tahoe) • XCTest, Universal arm64+x86_64 .app, .dmg & Sparkle Appcast
    runs-on: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode 26 & Swift Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run GravityEditCore XCTest Suite
        working-directory: macos
        run: |
          swift build --build-tests
          BIN_DIR="$(swift build --build-tests --show-bin-path)"
          xcrun xctest "${BIN_DIR}/GravityEditMacPackageTests.xctest"

      - name: Build Universal GravityEdit.app, DMG, ZIP & Sparkle Appcast
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REL_VER="${GITHUB_REF#refs/tags/v}"
          else
            REL_VER="1.3.4"
          fi
          ./macos/scripts/package_app.sh "${REL_VER}"

      - name: Verify macOS Bundle Integrity, Universal arm64 Slice, Sparkle Linkage, Code Signature, Editor Pixel Rendering & Live Launch
        run: |
          APP="macos/dist/GravityEdit.app"
          test -f "${APP}/Contents/MacOS/GravityEdit"
          test -f "${APP}/Contents/Resources/AppIcon.icns"
          test -d "${APP}/Contents/Frameworks/Sparkle.framework"
          ARCHS="$(lipo -archs "${APP}/Contents/MacOS/GravityEdit")"
          echo "Built Mach-O architectures: ${ARCHS}"
          echo "${ARCHS}" | grep -q "arm64"
          otool -L "${APP}/Contents/MacOS/GravityEdit"
          codesign -dvvv "${APP}/Contents/MacOS/GravityEdit" 2>&1
          codesign -dvvv "${APP}/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1
          codesign --verify --deep --strict --verbose=2 "${APP}"
          plutil -lint "${APP}/Contents/Info.plist"

          echo "==> Verifying AppKit TextKit 1 code canvas glyph pixel rendering..."
          swift macos/scripts/verify_editor_rendering.swift

          echo "==> Executing live macOS process launch & dyld @rpath/Sparkle.framework smoke test..."
          SMOKE_DIR="$(mktemp -d)"
          ditto -x -k macos/dist/GravityEdit-macOS-*.app.zip "${SMOKE_DIR}"
          SMOKE_BIN="${SMOKE_DIR}/GravityEdit.app/Contents/MacOS/GravityEdit"

          "${SMOKE_BIN}" >/tmp/gravityedit-smoke.log 2>&1 &
          SMOKE_PID=$!
          sleep 4

          if ! kill -0 "${SMOKE_PID}" 2>/dev/null; then
            echo "ERROR: GravityEdit exited or crashed during dyld/SwiftUI startup!"
            cat /tmp/gravityedit-smoke.log || true
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
            cat ~/Library/Logs/DiagnosticReports/GravityEdit* 2>/dev/null || true
            exit 1
          fi

          echo "SUCCESS: GravityEdit (PID ${SMOKE_PID}) launched cleanly, mapped Sparkle.framework via dyld4, and stayed running!"
          kill -TERM "${SMOKE_PID}" 2>/dev/null || true
          wait "${SMOKE_PID}" 2>/dev/null || true
          rm -rf "${SMOKE_DIR}"

      - name: Upload macOS Release Bundle Artifacts (.dmg, .app.zip, appcast.xml)
        uses: actions/upload-artifact@v4
        with:
          name: GravityEdit-macOS-LiquidGlass
          path: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
            macos/dist/*.app.zip
            macos/dist/*.app.zip.sha256
            macos/dist/appcast.xml

      - name: Publish macOS Assets & Sparkle Appcast to GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          DMG_FILE="macos/dist/GravityEdit-macOS-${TAG_NAME}.dmg"
          ZIP_FILE="macos/dist/GravityEdit-macOS-${TAG_NAME}.app.zip"
          APPCAST_FILE="macos/dist/appcast.xml"
          DMG_SHA=$(awk '{print $1}' "${DMG_FILE}.sha256")
          ZIP_SHA=$(awk '{print $1}' "${ZIP_FILE}.sha256")

          cat <<EOF > macos-release-notes.md
          ### GravityEdit ${TAG_NAME} — macOS Liquid Glass Edition + Android / Googlebook OS Workbench
          - **Native macOS Liquid Glass Application (\`com.gravityedit.mac\`):** Engineered natively in Swift, SwiftUI, and AppKit (\`NSTextView\` + \`NSRulerView\`) using Apple's **macOS 26 Tahoe Liquid Glass** design system (\`GlassEffectContainer\`, \`.glassEffect\`, \`.glassEffectID\`, \`.buttonStyle(.glass)\` / \`.buttonStyle(.glassProminent)\`, floating \`NavigationSplitView\` sidebar, unified toolbar, and graceful vibrancy fallback on macOS 15 Sequoia) while keeping the code canvas crisp and opaque per Apple Human Interface Guidelines.
          - **In-App Automatic Updates (Sparkle 2 + CryptoKit SHA-256):** Supports background update checks via \`Sparkle.framework\` (\`appcast.xml\`) and verified in-app \`.app.zip\` SHA-256 bundle replacement with automatic relaunch.
          - **1:1 BBEdit & PowerShell Feature Parity:** Full PowerShell tokenizer, multi-line \`param(...)\` & procedural script Function Navigator (\`DFS-Migration.ps1\` \`var\`/\`tbl\`/\`blk\` landmarks), Code Folding, Inline Completions (\`Tab\` / \`⌥Space\`), live \`PSScriptAnalyzer\` Quick Fixes, all 14 BBEdit Text Factory operations (also exposed directly in the macOS **Text** menu bar), PCRE Regex Find/Replace + Multi-File Search, Side-by-Side Myers Diff, Clippings, Persistent Scratchpad, and 6-language localization (\`en\`, \`de\`, \`it\`, \`es\`, \`fr\`, \`el\`).

          ### macOS Cryptographic Digests
          - **DMG Installer:** \`GravityEdit-macOS-${TAG_NAME}.dmg\` (\`${DMG_SHA}\`)
          - **In-App Update Archive:** \`GravityEdit-macOS-${TAG_NAME}.app.zip\` (\`${ZIP_SHA}\`)
          - **Sparkle Feed:** \`appcast.xml\`
          EOF

          ASSETS=(
            "${DMG_FILE}"
            "${DMG_FILE}.sha256"
            "${ZIP_FILE}"
            "${ZIP_FILE}.sha256"
            "${APPCAST_FILE}"
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "GravityEdit ${TAG_NAME} — macOS Liquid Glass & Android / Googlebook OS Release" \
              --notes-file macos-release-notes.md || \
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          fi
